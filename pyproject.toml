[project]
name = "loveletter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "piper>=0.15.1",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
]

[project.scripts]
loveletter = "loveletter:main.main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
