name: Android · tests, APK et release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Installer le SDK requis
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests unitaires, lint et compilation réelle
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Autoriser l’accélération de l’émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tester les parcours sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/screenshots
            adb exec-out run-as fr.francoisbasset.loveletter cat files/qa-home.png > app/build/screenshots/home.png
            adb exec-out run-as fr.francoisbasset.loveletter cat files/qa-game.png > app/build/screenshots/game.png
            adb exec-out run-as fr.francoisbasset.loveletter cat files/qa-setup.png > app/build/screenshots/setup.png
      - name: Préparer l’APK et sa somme de contrôle
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/loveletter-v0.1.0.apk
          cd dist
          sha256sum loveletter-v0.1.0.apk > loveletter-v0.1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: loveletter-v0.1.0
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/
            app/build/screenshots/
      - name: Publier la première release vérifiée de cette version
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v0.1.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 existe déjà : publication inchangée. Incrémenter la version pour une nouvelle release.'
          else
            gh release create v0.1.0 \
              --target "$GITHUB_SHA" \
              --title 'Love Letter · Cour — v0.1.0' \
              --notes-file docs/release-v0.1.0.md \
              dist/loveletter-v0.1.0.apk dist/loveletter-v0.1.0.apk.sha256
          fi
